<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat Tier List</title>
    <style>
        /* মেইন থিম ও ব্যাকগ্রাউন্ড স্টাইল */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* হেডার স্টাইল */
        header {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1f2937, #111827);
            border-radius: 12px;
            border: 1px solid #374151;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            font-size: 2.5rem;
            color: #ff9f43;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        header p {
            color: #9ca3af;
            margin-top: 5px;
            font-size: 1rem;
        }

        /* টিয়ার কন্টেইনার লেআউট */
        .tier-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* প্রতিটি টিয়ার বক্সের কমন স্টাইল */
        .tier-card {
            background-color: #161b22;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #30363d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .tier-header {
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* আলাদা আলাদা টিয়ারের কালার স্কিম */
        .tier-1 .tier-header {
            background: linear-gradient(90deg, #d4af37, #aa7c11);
            color: #000;
        }
        .tier-2 .tier-header {
            background: linear-gradient(90deg, #c0c0c0, #708090);
            color: #000;
        }
        .tier-3 .tier-header {
            background: linear-gradient(90deg, #cd7f32, #8b4513);
            color: #fff;
        }

        /* প্লেয়ার লিস্ট এরিয়া */
        .player-list {
            padding: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        /* স্ক্রলবার কাস্টমাইজেশন */
        .player-list::-webkit-scrollbar {
            width: 6px;
        }
        .player-list::-webkit-scrollbar-thumb {
            background-color: #30363d;
            border-radius: 4px;
        }

        /* প্রতিটি প্লেয়ার রো (Row) এর স্টাইল */
        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            margin-bottom: 8px;
            background-color: #21262d;
            border-radius: 6px;
            border: 1px solid #30363d;
            transition: transform 0.2s, background-color 0.2s;
        }

        .player-item:hover {
            transform: scale(1.02);
            background-color: #30363d;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* মাইনক্রাফ্ট প্লেয়ার হেড (ডামি বক্স) */
        .player-head {
            width: 32px;
            height: 32px;
            background-color: #4b5563;
            border: 2px solid #9ca3af;
            border-radius: 4px;
            position: relative;
        }
        
        /* হেড এর ভেতরে মাইনক্রাফ্ট ফেসের মতো ছোট্ট চোখ আর্ট */
        .player-head::before, .player-head::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #000;
            top: 10px;
        }
        .player-head::before { left: 6px; }
        .player-head::after { right: 6px; }

        .player-name {
            font-size: 1rem;
            font-weight: 500;
            color: #c9d1d9;
        }

        /* রিলিজ বা আপগ্রেড অ্যারো আইকন */
        .arrow-icon {
            color: #58a6ff;
            font-size: 0.9rem;
        }
    </style>
</head>
